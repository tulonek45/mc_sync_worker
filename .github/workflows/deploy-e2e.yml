name: Deploy e2e

on:
  push:
    branches: [main]

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: e2e
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TEST_ENDPOINT: ${{ vars.E2E_URL }}
      DEV_AUTH_TOKEN_1: ${{ secrets.E2E_TOKEN_1 }}
      DEV_AUTH_TOKEN_2: ${{ secrets.E2E_TOKEN_2 }}
      E2E_USER: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: npm run typecheck && npm test

      - name: Deploy worker to e2e
        run: npm run deploy:e2e

      - name: Seed auth
        run: npm run seed:e2e:auth

      - name: Verify auth
        run: npm run e2e:auth

      - name: Acquire lock, check profiles, commit, heartbeat, and release
        run: |
          npm run e2e:lock -- acquire 1
          npm run e2e:profile
          npm run e2e:lock -- heartbeat 1
          npm run e2e:commit -- 1
          npm run e2e:latest
          npm run e2e:lock -- release 1

      - name: Ensure lock is released on failure
        if: failure()
        run: npm run e2e:lock -- release 1 || true
